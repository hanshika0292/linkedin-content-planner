# Runs lint, the TypeScript check, the unit tests and the production build on every push
# to main and every pull request. No secrets are needed: the Supabase and Gemini values are
# read in the browser at runtime, and the Gemini tests stub the network.
# The tests also run with the runner's clock in IST and US Pacific time, because the
# calendar date helpers depend on the local time zone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test
      - name: npm test (TZ=Asia/Kolkata)
        run: npm test
        env:
          TZ: Asia/Kolkata
      - name: npm test (TZ=America/Los_Angeles)
        run: npm test
        env:
          TZ: America/Los_Angeles
      - run: npm run build
